[project]
name = "vst-audit"
version = "0.1.0"
description = "Analyseur de plugins audio macOS (VST2/VST3/AU/CLAP) : validité, licences, démo, historique des analyses"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "rich>=13.7",
    "typer>=0.12",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
vst-audit = "vst_audit.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vst_audit"]
